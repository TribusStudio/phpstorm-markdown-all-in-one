# IntelliJ Platform Plugin Configuration
pluginGroup = com.tribus.markdown
pluginName = Markdown All-in-One
pluginRepositoryUrl = https://github.com/tribus/phpstorm-markdown-all-in-one
pluginVersion = 0.23.0

# IntelliJ Platform
# The plugin is COMPILED against the oldest supported platform so it stays
# binary-compatible across the whole sinceBuild..untilBuild range. Newer IDEs
# are covered by the Plugin Verifier (see verifyAgainstVersion below), not by
# bumping the compile target.
platformType = PS
platformVersion = 2025.1

# Declared compatibility range.
# 251 = PhpStorm 2025.1, 262 = PhpStorm 2026.2 (latest stable).
pluginSinceBuild = 251
pluginUntilBuild = 262.*

# Newest IDE the Plugin Verifier checks against.
verifyAgainstVersion = 2026.2.3

# Plugin Dependencies
platformPlugins =
platformBundledPlugins =

# Kotlin
kotlin.stdlib.default.dependency = false

# Gradle
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.parallel = true
