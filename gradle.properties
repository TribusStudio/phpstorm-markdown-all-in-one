# IntelliJ Platform Plugin Configuration
pluginGroup = com.tribus.markdown
pluginName = Markdown All-in-One
pluginRepositoryUrl = https://github.com/tribus/phpstorm-markdown-all-in-one
pluginVersion = 0.24.0

# IntelliJ Platform
# The plugin is COMPILED against the oldest supported platform so it stays
# binary-compatible across the whole sinceBuild..untilBuild range. Newer IDEs
# are covered by the Plugin Verifier (see verifyAgainstVersion below), not by
# bumping the compile target.
platformType = PS
platformVersion = 2025.1

# Declared compatibility range.
# 251 = PhpStorm 2025.1, 262 = PhpStorm 2026.2.
#
# 262 was withdrawn in 0.23.2 after IDE lockups and restored in 0.24.0, once the
# cause was fixed (JCEF moved out of the platform core in 2026.2 — see docs/009
# §7) AND the fix was confirmed by opening a markdown file in a real 2026.2 IDE.
#
# Do not raise this ceiling on the strength of a green Plugin Verifier run. The
# verifier is a static binary-compatibility check that never launches the
# plugin; that is exactly how the 262 lockup shipped. Launch the IDE
# (./dev gradle runIde with platformVersion pointed at the new build) and open a
# markdown file first. See docs/009 §5.
pluginSinceBuild = 251
pluginUntilBuild = 262.*

# Newest IDE the Plugin Verifier checks against. Tracks pluginUntilBuild.
verifyAgainstVersion = 2026.2.3

# Plugin Dependencies
platformPlugins =
platformBundledPlugins =

# Kotlin
kotlin.stdlib.default.dependency = false

# Gradle
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.parallel = true
