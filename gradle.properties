# IntelliJ Platform Plugin Configuration
pluginGroup = com.tribus.markdown
pluginName = Markdown All-in-One
pluginRepositoryUrl = https://github.com/tribus/phpstorm-markdown-all-in-one
pluginVersion = 0.23.3

# IntelliJ Platform
# The plugin is COMPILED against the oldest supported platform so it stays
# binary-compatible across the whole sinceBuild..untilBuild range. Newer IDEs
# are covered by the Plugin Verifier (see verifyAgainstVersion below), not by
# bumping the compile target.
platformType = PS
platformVersion = 2025.1

# Declared compatibility range.
# 251 = PhpStorm 2025.1, 261 = PhpStorm 2026.1.
#
# 262 (PhpStorm 2026.2) is DELIBERATELY EXCLUDED as of 0.23.2. Raising the
# ceiling to 262 in 0.23.0 was validated only by the Plugin Verifier, which is
# a static binary-compatibility check and never runs the plugin. On a real
# 2026.2 IDE, opening a .md file hangs the EDT in
# blockingWaitForCompositeFileOpen — the editor composite never finishes
# building. Root cause is still under investigation.
#
# Do not raise this again without launching a real 2026.2 IDE (./dev gradle
# runIde) and opening a markdown file. See docs/009.
pluginSinceBuild = 251
pluginUntilBuild = 261.*

# Newest IDE the Plugin Verifier checks against. Tracks pluginUntilBuild.
verifyAgainstVersion = 2026.1.5

# Plugin Dependencies
platformPlugins =
platformBundledPlugins =

# Kotlin
kotlin.stdlib.default.dependency = false

# Gradle
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.parallel = true
